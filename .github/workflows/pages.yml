name: Publicar manual en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Compilar con Jekyll
        uses: actions/jekyll-build-pages@v1
        env:
          JEKYLL_ENV: production
        with:
          source: ./
          destination: ./_site

      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
