name: Publicar manual MkDocs en GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "source/**"
      - "examples/water-box/**"
      - "tests/test_water_box.py"
      - "guia.md"
      - "scripts/build_docs.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Comprobar scripts y cálculos de agua (sin ejecutar GROMACS)
        run: |
          python -m compileall -q examples/water-box
          python -m unittest discover -s tests -p "test_water_box.py" -v
      - name: Generar capítulos
        run: python scripts/build_docs.py
      - name: Construir MkDocs
        run: mkdocs build --clean --site-dir site
      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Subir artefacto
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
