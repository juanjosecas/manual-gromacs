title: Manual de referencia de GROMACS
description: Guía práctica y fundamentos para simulaciones de dinámica molecular
url: "https://juanjosecas.github.io"
baseurl: "/manual-gromacs"

lang: es
locale: es_ES
encoding: utf-8

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

permalink: pretty
future: false
show_drafts: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

author: Juan José Casal
github:
  username: juanjosecas

exclude:
  - LICENSE
  - README.md
  - "*.docx"
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata

include:
  - .well-known
