<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#14324a">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="{{ '/assets/site.js' | relative_url }}"></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <button id="menu-button" type="button" aria-controls="sidebar" aria-expanded="false">☰ Índice</button>
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Navegación principal">
      <a href="{{ '/' | relative_url }}">Manual completo</a>
      <a href="{{ '/guia/' | relative_url }}">Guía tutorial</a>
      <a class="repository" href="https://github.com/juanjosecas/manual-gromacs">Repositorio</a>
    </nav>
  </header>

  <div class="page">
    <aside id="sidebar">
      <label for="toc-search">Buscar una sección</label>
      <input id="toc-search" type="search" placeholder="Membrana, FEP, PCA…">
      <nav id="toc" aria-label="Índice de esta página"></nav>
    </aside>

    <main id="contenido" tabindex="-1">
      <article>{{ content }}</article>
      <footer>El sitio se reconstruye automáticamente desde los archivos Markdown del repositorio.</footer>
    </main>
  </div>
  <div id="backdrop" hidden></div>
</body>
</html>
